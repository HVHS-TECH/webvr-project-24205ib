<!DOCTYPE html>
<html>
  <head>

<script src="https://aframe.io/releases/1.1.0/aframe.min.js"></script>
<script src="https://rawgit.com/donmccurdy/aframe-extras/v2.1.1/dist/aframe-extras.loaders.min.js"></script> 

  </head>
    <body>
    <a-scene>
      <a-sky color="lightblue"></a-sky>
      <a-light id="amb" type="ambient" position="11.6 4 -12"></a-light>

      <a-light id="dir" type="directional" light="castShadow: true" ></a-light>
      
      <a-light id="pnt" type="point" ></a-light>
      
      <a-light id="spt" type="spot" ></a-light>
      <a-plane id="ground" position="4 -3 -7" rotation="-90 0 0" color="cyan" scale = "10 10 10" shadow="receive: true"></a-plane>


<!-- Put this inside the <a-scene> -->
      <a-entity 
      ply-model="src:environment.ply"
      position="9 -8 -2"
      rotation="-90 0 90"
      ></a-entity>  
      <a-entity 
      ply-model="src:pizza.ply"
      position="11.6 -4.5 -12"
      rotation="-90 0 90"
      ></a-entity>        
      <a-entity 
      ply-model="src:Car.ply"
      position="-1 -3.4 -14.5"
      rotation="-90 0 0"
      animation="
      property: position;
      from:-10 -3.4 -14.5;
      to:10 0 -14.6; 
      loop: true;
      "
      
      ></a-entity>    
    </a-scene>
  </body>
  
</html>
